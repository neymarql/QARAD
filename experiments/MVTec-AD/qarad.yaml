version: v1.0.0
random_seed: 100

dataset:
  type: mvtec
  image_reader:
    type: opencv
    kwargs:
      image_dir: /home/qianlong/mnt_link/hartad/data/mvtec_anomaly_detection/
      color_mode: RGB
  json_root: /home/qianlong/mnt_link/hartad/data/descriptions_qwen2.5_32b_mvtecad
  category: "{}"
  train:
    meta_file: data/MVTec-AD/samples/train_{}.json
    hflip: False
    vflip: False
    rotate: False
  test:
    meta_file: ./data/MVTec-AD/samples/test_{}.json
  sample_mode: pair
  normal_ratio: 0.5
  input_size: [512,512]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  batch_size: 6
  workers: 0
  clip_w: softmax
  clip_linear_min: 0.05
  clip_softmax_temp: 0.5

structure:
  - name: block1
    layers:
      - idx: layer1
        planes: 256
    stride: 4
  - name: block2
    layers:
      - idx: layer2
        planes: 512
    stride: 8
  - name: block3
    layers:
      - idx: layer3
        planes: 512
    stride: 16
  - name: block4
    layers:
      - idx: layer4
        planes: 256
    stride: 32

net:
  - name: backbone
    type: models.backbones.Backbone
    frozen: True
    kwargs:
      backbone: wide_resnet50_2

  - name: afs
    type: models.afs.AFS
    frozen: True
    prev: backbone
    kwargs:
      init_bsn: 64

  - name: recon
    type: models.recon.ReconstructionLayer
    prev: afs
    kwargs:
      num_res_blocks: 2
      hide_channels_ratio: 0.5
      channel_mult: [1,2,4]
      attention_mult: [2,4]

  - name: rrs
    type: models.rrs.RRS
    prev: recon
    kwargs:
      modes: [max,mean]
      mode_numbers: [256,256]
      num_residual_layers: 2
      stop_grad: False

criterion:
  - name: SegmentCrossEntropyLoss
    type: SegmentCrossEntropyLoss
    kwargs:
      weight: 1.0
  - name: FeatureMSELoss
    type: FeatureMSELoss
    kwargs:
      weight: 1.0
  - name: ClassifierCrossEntropyLoss
    type: ClassifierCrossEntropyLoss
    kwargs:
      weight: 2.0
      
trainer:
  optimizer:
    type: Adam
    kwargs:
      lr: 0.0001
      betas: [0.9, 0.999]
  max_epoch: 2000
  val_freq_epoch: 10
  print_freq_step: 30
  early_stop:
    patience: 5
    delta: 0.0001

saver:
  checkpoints_dir: qarad_json_ckpts
  log_dir: qarad_json_log
  vis_dir: qarad_vis

evaluator:
  key_metric: mean
  metrics:
    auc:
      - name: image
        kwargs:
          avgpool_size: [16, 16]
      - name: pixel 
